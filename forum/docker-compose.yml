services:
  forum-service:
    build: .
    container_name: forum-service
    environment:
      spring.datasource.url: jdbc:postgresql://172.18.0.1:5433/ForumQuestions
      spring.datasource.username: postgres
      spring.datasource.password: changeme
      spring.jpa.hibernate.ddl-auto: update
      spring.jpa.show-sql: true
      spring.jpa.properties.hibernate.dialect: forum.forum.service.pgDialect.FtsPgDialect
      amqp.url: amqps://opqzgyoy:QbrQbz_pnUwVMFvHS6m0GEvVNpqMZQRv@cow.rmq2.cloudamqp.com/opqzgyoy
      amqp.password: QbrQbz_pnUwVMFvHS6m0GEvVNpqMZQRv
    depends_on:
      - postgres-db-forum
    ports:
      - "8082:8080"

  postgres-db-forum:
    image: postgres:15
    container_name: postgres-db-forum
    restart: always
    environment:
      POSTGRES_DB: ForumQuestions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
